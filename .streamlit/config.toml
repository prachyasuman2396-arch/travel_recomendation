[server]
headless = true
# Render sets PORT; the start command passes it. Streamlit Cloud ignores this file's port.
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showSidebarNavigation = false

[theme]
base = "light"
primaryColor = "#0F5C63"
backgroundColor = "#FBF7F1"
secondaryBackgroundColor = "#F4EDE2"
textColor = "#1F2A2E"
