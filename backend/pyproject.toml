[project]
name = "tourist-place-recommender-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
  "B008",   # FastAPI's Depends() in defaults is idiomatic
  "RUF001", "RUF002", "RUF003",  # en dashes / ≤ in strings are intentional (Google hours text, docs)
  "UP046", "UP047",  # explicit Generic[T] kept for readability
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: needs a real PostGIS database (set TEST_DATABASE_URL)",
  "live: calls real external APIs (set RUN_LIVE_TESTS=1 and credentials)",
]
addopts = "-ra"
